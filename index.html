
<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff0f5;
            text-align: center;
            color: #6b4055;
        }

        header {
            background: #f4b6cf;
            padding: 25px;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            padding: 40px 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 15px #e9c5d5;
        }

        button {
            background: #e88bb2;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #f4b6cf;
        }
    </style>
</head>

<body>

    <header>My Little Website 🌸</header>

    <div class="container">
        <div class="card">
            <h1>Welcome! 💗</h1>

            <p>
                Hello everyone! Welcome to my first website.
                This is my little corner of the internet.
            </p>

            <button onclick="alert('Thank you for visiting! ❤️')">
                Click Me!
            </button>
        </div>
    </div>

    <footer>
        Made with love ♡
    </footer>

</body>
</html>
