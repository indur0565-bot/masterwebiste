
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Gaming World</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf5ff;color:#17466e;font-family:Arial;text-align:center}
header,footer{background:#087acb;color:white;padding:22px;font-size:25px;font-weight:bold}
main{padding:20px 12px}
.welcome,.game-area{background:white;padding:22px;border-radius:18px;max-width:600px;margin:20px auto;box-shadow:0 4px 14px #b8d9f2}
h2{color:#087acb;margin-top:35px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:900px;margin:20px auto}
.game{background:white;border-radius:15px;padding:13px 6px;box-shadow:0 3px 10px #bdd9ef;cursor:pointer}
.game:active{transform:scale(.97)}
.pic{font-size:42px;background:#d9efff;border-radius:12px;padding:12px}
.game h3{font-size:15px;margin:10px 0 4px}
.game p{font-size:12px;margin:5px}
button{background:#087acb;color:white;border:0;border-radius:10px;padding:11px 16px;margin:5px;font-size:15px}
button:active{background:#07538a}
.game-area{display:none}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:270px;margin:15px auto}
.cell{height:75px;font-size:28px}
#snakeCanvas{max-width:100%;background:#12354e;border-radius:10px}
#threeArea{width:100%;height:320px;background:#102c45;border-radius:12px;overflow:hidden}
.controls{margin:12px}
input{padding:10px;width:100px}
.status{font-weight:bold;min-height:25px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>💙 MY GAMING WORLD 🎮</header>
<main>
<div class="welcome">
<h1>Welcome to My Website! 💙</h1>
<p>Play games and enjoy your gaming world!</p>
</div>

<h2>🎮 2D GAMES (20)</h2>
<div class="grid" id="twoD"></div>

<h2>🌎 3D GAMES (20)</h2>
<div class="grid" id="threeD"></div>

<div class="game-area" id="gameArea">
<h2 id="gameTitle">Game</h2>
<div id="gameContent"></div>
<p class="status" id="status"></p>
<button onclick="closeGame()">⬅ Back to Games</button>
</div>
</main>
<footer>Made with 💙 | Gaming World</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const games2D=[
["⭕","Tic Tac Toe","tic"],
["🐍","Snake Game","snake"],
["🧠","Memory Match","memory"],
["🔢","Number Guess","guess"],
["✊","Rock Paper Scissors","rps"],
["🏓","Ping Pong","soon"],
["🧱","Brick Breaker","soon"],
["🚀","Space Shooter","soon"],
["🏃","Running Game","soon"],
["🧩","Puzzle Game","soon"],
["🎯","Target Shooter","soon"],
["🏀","Basketball","soon"],
["⚽","Football","soon"],
["🏸","Badminton","soon"],
["🚗","Car Dodging","soon"],
["🎈","Balloon Pop","soon"],
["🍎","Fruit Catch","soon"],
["🐦","Flappy Bird","soon"],
["♟️","Chess","soon"],
["🎲","Dice Game","soon"]
];

const games3D=[
["🏎️","3D Car Racing","car3d"],
["🏍️","3D Bike Racing","soon"],
["🌄","3D Adventure","soon"],
["⚽","3D Football","soon"],
["🧱","3D Block World","soon"],
["🚀","3D Space World","soon"],
["🏝️","3D Island","soon"],
["🏁","3D Track Racing","soon"],
["🚂","3D Train World","soon"],
["✈️","3D Flight","soon"],
["🐠","3D Ocean","soon"],
["🏰","3D Castle","soon"],
["🌳","3D Forest","soon"],
["🎳","3D Bowling","soon"],
["🏀","3D Basketball","soon"],
["🚢","3D Ship World","soon"],
["🪐","3D Planet World","soon"],
["🛸","3D UFO Game","soon"],
["🏟️","3D Stadium","soon"],
["🎢","3D Roller Coaster","soon"]
];

function makeCards(list,id){
 document.getElementById(id).innerHTML=list.map(g=>
 `<div class="game" onclick="openGame('${g[2]}','${g[1]}')">
 <div class="pic">${g[0]}</div><h3>${g[1]}</h3>
 <p>${g[2]==="soon"?"Coming Soon":"▶ Play Now"}</p></div>`
 ).join("");
}
makeCards(games2D,"twoD");
makeCards(games3D,"threeD");

let current="",timer=null,scene,camera,renderer,player,obstacles=[],score=0,carSpeed=0;
const area=document.getElementById("gameArea");
const content=document.getElementById("gameContent");
const statusText=document.getElementById("status");

function openGame(type,name){
 closeGame();
 current=type;
 area.style.display="block";
 area.scrollIntoView({behavior:"smooth"});
 document.getElementById("gameTitle").textContent=name;
 statusText.textContent="";
 content.innerHTML="";

 if(type==="tic")startTic();
 else if(type==="snake")startSnake();
 else if(type==="memory")startMemory();
 else if(type==="guess")startGuess();
 else if(type==="rps")startRPS();
 else if(type==="car3d")start3D();
 else statusText.textContent="This game is coming soon. More games will be added!";
}

function closeGame(){
 clearInterval(timer);
 timer=null;
 if(renderer){
  renderer.dispose();
  renderer=null;
 }
 if(area)area.style.display="none";
 content.innerHTML="";
 current="";
}

// TIC TAC TOE
let cells=[],turn="X";
function startTic(){
 cells=Array(9).fill("");
 turn="X";
 content.innerHTML='<div id="board"></div><button onclick="startTic()">Restart</button>';
 drawTic();
}
function drawTic(){
 let b=document.getElementById("board");
 if(!b)return;
 b.innerHTML=cells.map((v,i)=>`<button class="cell" onclick="ticMove(${i})">${v}</button>`).join("");
 statusText.textContent="Turn: "+turn;
}
function ticMove(i){
 if(cells[i]||winner())return;
 cells[i]=turn;
 if(winner()){drawTic();statusText.textContent=turn+" wins! 🎉";return}
 if(!cells.includes("")){drawTic();statusText.textContent="It's a draw!";return}
 turn=turn==="X"?"O":"X";
 drawTic();
}
function winner(){
 let lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 return lines.some(l=>cells[l[0]]&&cells[l[0]]===cells[l[1]]&&cells[l[1]]===cells[l[2]]);
}

// SNAKE
let snake,food,dir="right",nextDir="right";
function startSnake(){
 content.innerHTML='<canvas id="snakeCanvas" width="300" height="300"></canvas><p>Use arrow buttons</p><div><button onclick="snakeDir(\'up\')">⬆️</button><br><button onclick="snakeDir(\'left\')">⬅️</button><button onclick="snakeDir(\'down\')">⬇️</button><button onclick="snakeDir(\'right\')">➡️</button></div><button onclick="startSnake()">Restart</button>';
 snake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}];
 dir=nextDir="right";newFood();drawSnake();
 timer=setInterval(moveSnake,150);
}
function newFood(){food={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)}}
function snakeDir(d){
 let opp={up:"down",down:"up",left:"right",right:"left"};
 if(opp[d]!==dir)nextDir=d;
}
document.addEventListener("keydown",e=>{
 let map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
 if(current==="snake"&&map[e.key]){e.preventDefault();snakeDir(map[e.key])}
});
function drawSnake(){
 let c=document.getElementById("snakeCanvas");if(!c)return;
 let x=c.getContext("2d");x.clearRect(0,0,300,300);
 x.fillStyle="#ffcf33";x.fillRect(food.x*20,food.y*20,18,18);
 x.fillStyle="#42d66b";snake.forEach(p=>x.fillRect(p.x*20,p.y*20,18,18));
}
function moveSnake(){
 dir=nextDir;let h={...snake[0]};
 if(dir==="up")h.y--;if(dir==="down")h.y++;
 if(dir==="left")h.x--;if(dir==="right")h.x++;
 if(h.x<0||h.x>14||h.y<0||h.y>14||snake.some(p=>p.x===h.x&&p.y===h.y)){
 clearInterval(timer);timer=null;statusText.textContent="Game Over! Score: "+(snake.length-3);return;
 }
 snake.unshift(h);
 if(h.x===food.x&&h.y===food.y)newFood();else snake.pop();
 statusText.textContent="Score: "+(snake.length-3);
 drawSnake();
}

// MEMORY
let symbols=[],first=null,locked=false,matches=0;
function startMemory(){
 symbols=["🐶","🐱","🐸","🦊","🐼","🐵","🐶","🐱","🐸","🦊","🐼","🐵"].sort(()=>Math.random()-.5);
 first=null;locked=false;matches=0;
 content.innerHTML='<div class="grid" style="grid-template-columns:repeat(4,1fr)" id="memoryGrid"></div><button onclick="startMemory()">Restart</button>';
 document.getElementById("memoryGrid").innerHTML=symbols.map((s,i)=>`<button id="m${i}" onclick="flip(${i})">?</button>`).join("");
 statusText.textContent="Find matching pairs!";
}
function flip(i){
 if(locked)return;
 let b=document.getElementById("m"+i);
 if(b.textContent!=="?")return;
 b.textContent=symbols[i];
 if(first===null){first=i;return}
 let old=first;first=null;locked=true;
 if(symbols[old]===symbols[i]){
 matches++;locked=false;
 if(matches===6)statusText.textContent="You won! 🎉";
 }else{
 setTimeout(()=>{
  document.getElementById("m"+old).textContent="?";
  document.getElementById("m"+i).textContent="?";
  locked=false;
 },700);
 }
}

// NUMBER GUESS
let secret;
function startGuess(){
 secret=Math.floor(Math.random()*20)+1;
 content.innerHTML='<p>Guess a number from 1 to 20</p><input id="guess" type="number" min="1" max="20"><button onclick="checkGuess()">Check</button><button onclick="startGuess()">New Game</button>';
 statusText.textContent="Your game has started!";
}
function checkGuess(){
 let n=Number(document.getElementById("guess").value);
 if(n===secret)statusText.textContent="Correct! You won! 🎉";
 else if(n<1||n>20)statusText.textContent="Enter 1 to 20";
 else statusText.textContent=n<secret?"Try a bigger number!":"Try a smaller number!";
}

// ROCK PAPER SCISSORS
function startRPS(){
 content.innerHTML="<p>Choose your move</p><button onclick=\"rps('Rock')\">✊ Rock</button><button onclick=\"rps('Paper')\">✋ Paper</button><button onclick=\"rps('Scissors')\">✌️ Scissors</button>";
}
function rps(p){
 let c=["Rock","Paper","Scissors"][Math.floor(Math.random()*3)];
 let result=p===c?"Draw!":((p==="Rock"&&c==="Scissors")||(p==="Paper"&&c==="Rock")||(p==="Scissors"&&c==="Paper"))?"You win!":"Computer wins!";
 statusText.textContent="You: "+p+" | Computer: "+c+" — "+result;
}

// 3D CAR GAME
function start3D(){
 if(typeof THREE==="undefined"){
  statusText.textContent="3D library could not load. Check your internet connection.";
  return;
 }
 content.innerHTML='<div id="threeArea"></div><p>Move your car left and right to avoid blocks.</p><div class="controls"><button onclick="moveCar(-1)">⬅️ LEFT</button><button onclick="moveCar(1)">RIGHT ➡️</button></div><button onclick="start3D()">Restart 3D Game</button>';
 score=0;carSpeed=0.12;obstacles=[];
 const box=document.getElementById("threeArea");
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x8fd3ff);
 camera=new THREE.PerspectiveCamera(70,box.clientWidth/box.clientHeight,0.1,100);
 camera.position.set(0,5,9);
 camera.lookAt(0,0,0);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(box.clientWidth,320);
 box.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x446688,2));
 let road=new THREE.Mesh(new THREE.BoxGeometry(8,.2,45),new THREE.MeshStandardMaterial({color:0x333b46}));
 road.position.z=-12;
 scene.add(road);
 for(let x of [-2,0,2]){
  let line=new THREE.Mesh(new THREE.BoxGeometry(.07,.03,45),new THREE.MeshBasicMaterial({color:0xffffff}));
  line.position.set(x,.12,-12);scene.add(line);
 }
 player=new THREE.Mesh(new THREE.BoxGeometry(1,0.6,1.8),new THREE.MeshStandardMaterial({color:0x087acb}));
 player.position.set(0,.55,4);
 scene.add(player);
 for(let i=0;i<5;i++)addObstacle(-25-i*9);
 let running=true;
 function animate(){
  if(!renderer||current!=="car3d")return;
  requestAnimationFrame(animate);
  obstacles.forEach(o=>{
   o.position.z+=carSpeed;
   if(o.position.z>7){
    o.position.z=-35;
    o.position.x=[-2,0,2][Math.floor(Math.random()*3)];
    score++;
    statusText.textContent="Score: "+score;
   }
   if(Math.abs(o.position.x-player.position.x)<.8&&Math.abs(o.position.z-player.position.z)<1.2){
    statusText.textContent="Crash! Score: "+score+" — Press Restart";
    carSpeed=0;
   }
  });
  renderer.render(scene,camera);
 }
 animate();
}
function addObstacle(z){
 let o=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xff5555}));
 o.position.set([-2,0,2][Math.floor(Math.random()*3)],.65,z);
 scene.add(o);obstacles.push(o);
}
function moveCar(d){
 if(player)player.position.x=Math.max(-2,Math.min(2,player.position.x+d*2));
}
</script>
</body>
</html>
